name: ALFA-MT76X8-5MB-4G-CN
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载源码
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-23.05
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev git python3 unzip wget gawk flex bison libssl-dev

      - name: 写入配置
        run: |
          cat > .config <<'EOF'
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt76x8=y
CONFIG_TARGET_ramips_mt76x8_DEVICE_alfa_network_awusfree1=y
CONFIG_SMALL_FLASH=y
CONFIG_PACKAGE_dnsmasq=y
CONFIG_PACKAGE_dropbear=y
CONFIG_PACKAGE_uhttpd=y
CONFIG_PACKAGE_firewall=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_kmod-mt76x8=y
CONFIG_PACKAGE_kmod-usb-core=y
CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
CONFIG_PACKAGE_uqmi=y
CONFIG_IPV6=n
EOF

      - name: 安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci luci-i18n-base-zh-cn

      - name: 编译
        run: |
          make defconfig
          make download -j4
          make -j4 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt76x8/*.bin
